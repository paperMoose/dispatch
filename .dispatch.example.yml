# dispatch configuration
# Copy to ~/.dispatch.yml and customize

# Base branch for new worktrees (default: dev)
base_branch: dev

# Which agent CLI to drive: claude or codex (default: claude)
# agent: claude

# Model per runtime. These are separate keys because model names are not
# portable: `model:` is read only when agent is claude, `codex_model:` only
# when it is codex. Setting `model: gpt-5.6-sol` under `agent: codex` is
# ignored, and codex silently runs its own default.
# model: opus[1m]
# codex_model: gpt-5.6-sol

# Codex reasoning depth: low | medium | high | xhigh | max | ultra.
# Ignored by claude, which has no CLI equivalent.
# reasoning_effort: xhigh

# Permission mode for agents (default: dontAsk — no prompts).
# Set to "" to get normal permission prompts back.
# permission_mode: dontAsk

# Maximum agent turns for headless mode
# max_turns: 20

# Maximum budget (USD) for headless mode
# max_budget: 5.00

# Directory for worktrees relative to repo root (default: .worktrees)
worktree_dir: .worktrees
